[project]
name = "data-analytics-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FrancescoPioBellantuono", email = "frabellantuono3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
data-analytics-lab = "data_analytics_lab:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
